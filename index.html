<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comercial Oliveira - Catálogo Online</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-24">
    <header class="bg-blue-900 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-store text-amber-400"></i> Comercial Oliveira
                </h1>
                <p id="lbl-endereco-loja" class="text-xs text-blue-200">Elétrica, Hidráulica & Materiais de Construção</p>
            </div>
            <div class="relative w-full sm:w-80">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" id="busca-catalogo" placeholder="Buscar produto..." oninput="renderizarCatalogo()" class="border rounded-lg pl-9 pr-3 py-2 text-sm w-full bg-slate-800/50 text-white placeholder-slate-300 focus:outline-none focus:bg-white focus:text-slate-800">
            </div>
        </div>
    </header>
    <main class="container mx-auto px-4 py-6 max-w-6xl">
        <div class="mb-6 bg-white p-4 rounded-xl shadow-sm border flex flex-col sm:flex-row justify-between items-center gap-2">
            <div>
                <h2 class="text-lg font-bold text-slate-700">Produtos Disponíveis</h2>
                <p class="text-xs text-slate-500">Selecione os itens desejados para montar o seu orçamento.</p>
            </div>
            <div id="status-carrinho" class="text-sm font-medium text-blue-600 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100">
                <i class="fa-solid fa-cart-shopping"></i> Carrinho Vazio
            </div>
        </div>
        
        <!-- Lista de Produtos / Grade -->
        <div id="grid-produtos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <!-- Os produtos serão injetados dinamicamente ou inseridos aqui -->
        </div>
    </main>

    <footer class="bg-white border-t py-4 text-center text-xs text-slate-500 fixed bottom-0 left-0 w-full shadow-inner">
        <p>Comercial Oliveira &copy; 2026 - Todos os direitos reservados.</p>
    </footer>
</body>
</html>
