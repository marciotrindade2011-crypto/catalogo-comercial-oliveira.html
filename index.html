<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comercial Oliveira - Catálogo Oficial</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
        header { background: #ff6a00; color: #fff; padding: 25px 15px; text-align: center; position: sticky; top:0; z-index:10; }
        .container { max-width: 1000px; margin: auto; padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .card { background: #fff; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 180px; border-radius: 8px; object-fit: cover; background:#eee; }
        .produto-titulo { font-size: 17px; font-weight: bold; margin: 12px 0 5px; color: #333; min-height:40px; }
        .preco { color: #008000; font-weight: bold; font-size: 22px; margin-bottom:10px; }
        .btn-zap { background: #25D366; color: white; text-align:center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; display:block; margin-top:auto; }
        .btn-zap:hover { background: #128C7E; }
    </style>
</head>
<body>
    <header>
        <h1>🛒 Comercial Oliveira</h1>
        <p>Catálogo Oficial - (84) 99966-2290</p>
    </header>
    <div class="container">
        <div class="card">
            <img src="https://via.placeholder.com/300x180?text=Foto+do+Produto" alt="Produto">
            <div class="produto-titulo">Seu Produto Aqui</div>
            <div class="preco">R$ 29,90</div>
            <a class="btn-zap" href="https://wa.me/5584999662290?text=Olá! Vi no catálogo e quero esse produto!" target="_blank">Pedir no WhatsApp</a>
        </div>
    </div>
</body>
</html>
