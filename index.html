<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comercial Oliveira - Catálogo</title>
    <style>
        body { font-family: Arial; margin: 0; background: #f5f5f5; }
        header { background: #ff6a00; color: #fff; padding: 20px; text-align: center; }
        .container { max-width: 900px; margin: auto; padding: 15px; }
        .card { background: #fff; border-radius: 10px; padding: 15px; margin: 15px 0; display: flex; gap: 15px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100px; height: 100px; border-radius: 8px; object-fit: cover; }
        .info { flex: 1; }
        .produto-titulo { font-size: 18px; font-weight: bold; margin-bottom: 5px; color: #333; }
        .preco { color: #25D366; font-weight: bold; font-size: 18px; margin-top: 5px; }
        .btn { background: #25D366; color: #fff; padding: 10px 15px; border-radius: 5px; text-decoration: none; display: inline-block; margin-top: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>Comercial Oliveira</h1>
        <p>Catálogo de Produtos</p>
    </header>

    <div class="container">
        
        <!-- Exemplo de Produto 1 -->
        <div class="card">
            <img src="url_da_imagem.jpg" alt="Produto">
            <div class="info">
                <div class="produto-titulo">Nome do Produto Aqui</div>
                <div class="preco">R$ 00,00</div>
                <a href="https://wa.me/55SEUNUMERO?text=Olá!%20Gostaria%20de%20saber%20mais%20sobre%20o%20produto." class="btn" target="_blank">Pedir pelo WhatsApp</a>
            </div>
        </div>

    </div>

</body>
</html>
